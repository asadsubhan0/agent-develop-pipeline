# Enterprise Skills

Instructions: 
  - This pipeline is for an air gapped environment, so don't use apt/yum install commands. All the required tools and binaries are there in the runners so use those.
  - Also while building the pipeline, if there are some concurrent steps/jobs need to be executed one after the other and they are using the same runner, than put them inside single job in different steps.
  - Each pipeline you build should follow the basic steps like checkout code, build, sonar scan, building OCP image, flyway database migration, deploying that image to OCP cluster, scanning image using prisma twistlock, tagging andpushing image to github packages registry. 


github_server_url: https://github.com
shared_repository: DevOps/shared_libraries
shared_ref_approved_immutable_sha: null
pipeline_repository: https://github.com/Micro-DevOps/service-a
pipeline_workflow_directory: .github/workflows
jenkins_directory: Jenkins-pipelines
github_output_directory: GitHub-pipelines
max_context_characters: 450000

# Policy Skills
## Use only below mentioned actions, for all the other tasks use custom scripts/bash
allow_secrets_inherit: true
allowed_action_repositories:
  - actions/checkout@v3
  - actions/upload-artifact@v3
  - actions/download-artifact@v3
  - DevOps/vault-action@v2
  - DevOps/action-send-mail@v1
block_tls_bypass: false
block_secret_echo: true
block_broad_workspace_delete: true
max_file_bytes: 250000


# Services Endpoints and URLs

sonarqube:
  url: https://sonarqube.com
  scanner_home: /opt/sonar-scanner-4.4.0.2170
vault:
  url: https://azvault.com
  action: DevOps/vault-action@v2
  auth_method: token
  tls_verification_required: false
  ca_bundle: null
registries:
  github_packages: ghcr.io
  gradle_distribution: https://ghcr.io/gradle-service/distributions/gradle-${gradle_version}-all.zip
ocp:
  api_url: https://api.ocp.systemsltd.local:6443
  console_url: https://console-openshift-console.apps.ocp.systemsltd.local
prisma:
  api_base: https://prismacloud-twistlock.com/api/v1

# Runners

