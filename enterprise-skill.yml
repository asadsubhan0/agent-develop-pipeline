# Policy Skills
## Use only below mentioned actions, for all the other tasks use custom scripts/bash
allow_secrets_inherit: true
allowed_action_repositories:
  - actions/checkout@v3
  - actions/upload-artifact@v3
  - actions/download-artifact@v3
  - ADIB-DevOps/vault-action@v2
  - ADIB-DevOps/action-send-mail@v1
block_tls_bypass: false
block_secret_echo: true
block_broad_workspace_delete: true
max_file_bytes: 250000


