# Enterprise Skills

Instrcutions: 
  - This pipeline is for an air gapped environment, so don't use apt/yum install commands. All the required tools and binaries are there in the runners so use those.
  - Also while building the pipeline, if there are some concurrent steps/jobs need to be executed one after the other and they are using the same runner, than put them inside single job in different steps.
  - Each pipeline you build should follow the basic steps like checkout code, build, sonar scan, building OCP image, deploying that image to OCP cluster, pushing image to github packages registry. 


